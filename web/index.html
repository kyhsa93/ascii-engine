<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ascii-engine</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #d8d4cc;
        --dim: #6b6560;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #07070b;
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #screen {
        flex: 1;
        margin: 0;
        padding: 0;
        overflow: hidden;
        line-height: 1.05;
        font-size: 13px;
        white-space: pre;
        user-select: none;
      }
      footer {
        flex: none;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--dim);
        border-top: 1px solid #1b1b22;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
      }
      footer strong {
        color: var(--ink);
        font-weight: 500;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: #15151d;
        border: 1px solid #2a2a35;
        border-radius: 4px;
        padding: 3px 9px;
        cursor: pointer;
      }
      button:hover {
        background: #1f1f2a;
      }
    </style>
  </head>
  <body>
    <pre id="screen"></pre>
    <footer>
      <span id="stats"></span>
      <button data-action="shape">shape</button>
      <button data-action="ramp">ramp</button>
      <button data-action="texture">texture</button>
      <button data-action="shadow">shadow</button>
      <button data-action="aa">aa</button>
      <button data-action="normals">normals</button>
      <button data-action="pause">pause</button>
      <span>drag to orbit &middot; scroll to zoom</span>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
